name: FreeFlight Cabin Controls CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore FreeFlight.CabinControl.slnx

      - name: Build
        shell: pwsh
        run: dotnet build FreeFlight.CabinControl.slnx -c Release --no-restore

      - name: Run core regression checks
        shell: pwsh
        run: dotnet run --project tests/FreeFlight.CabinControl.Core.Tests/FreeFlight.CabinControl.Core.Tests.csproj -c Release --no-build
