name: Publish FreeFlight rollback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freeflight-release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      RELEASE_VERSION: 0.4.9.0

    steps:
      - name: Check out rollback source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build stable rollback
        shell: pwsh
        run: |
          dotnet restore FreeFlight.CabinControl.slnx
          dotnet build FreeFlight.CabinControl.slnx -c Release --no-restore `
            -p:Version=$env:RELEASE_VERSION `
            -p:AssemblyVersion=$env:RELEASE_VERSION `
            -p:FileVersion=$env:RELEASE_VERSION

      - name: Run core regression checks
        shell: pwsh
        run: dotnet run --project tests/FreeFlight.CabinControl.Core.Tests/FreeFlight.CabinControl.Core.Tests.csproj -c Release --no-build

      - name: Build the FreeFlight X-Plane plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile artifacts/XPSDK430.zip
          Expand-Archive artifacts/XPSDK430.zip -DestinationPath artifacts/xplane-sdk
          cmake -S xplane-plugin -B artifacts/xplane-plugin-build -A x64 -DXPLANE_SDK_ROOT="$PWD/artifacts/xplane-sdk/SDK"
          cmake --build artifacts/xplane-plugin-build --config Release
          $destination = "xplane-plugin/dist/FreeFlightCabinBridge/64"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item artifacts/xplane-plugin-build/Release/win.xpl "$destination/win.xpl" -Force

      - name: Publish Windows application
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          dotnet publish src/FreeFlight.CabinControl.App/FreeFlight.CabinControl.App.csproj `
            -c Release -r win-x64 --self-contained true `
            --source https://api.nuget.org/v3/index.json `
            -o artifacts/publish `
            -p:Version=$env:RELEASE_VERSION `
            -p:AssemblyVersion=$env:RELEASE_VERSION `
            -p:FileVersion=$env:RELEASE_VERSION `
            -p:InformationalVersion="$env:RELEASE_VERSION+$shortSha"

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVersion=$env:RELEASE_VERSION" installer/FreeFlight.CabinControl.iss

      - name: Package rollback release
        shell: pwsh
        run: |
          $asset = "artifacts/FreeFlight-Cabin-Control-v$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path artifacts/publish/* -DestinationPath $asset -CompressionLevel Optimal
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FreeFlight-Cabin-Control-v$env:RELEASE_VERSION-win-x64.zip" | Set-Content "$asset.sha256" -Encoding ascii
          $installer = "artifacts/FreeFlight-Cabin-Control-v$env:RELEASE_VERSION-Setup.exe"
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  FreeFlight-Cabin-Control-v$env:RELEASE_VERSION-Setup.exe" | Set-Content "$installer.sha256" -Encoding ascii
          @"
          # FreeFlight Cabin Control v$env:RELEASE_VERSION

          Stable rollback release based on the exact v0.4.9 codebase (commit acef525).

          v0.5.0 development has been preserved separately on the codex/v0.5.0 branch for continued development and is not part of this rollback build.
          "@ | Set-Content artifacts/release-notes.md -Encoding utf8

      - name: Publish rollback as latest stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $asset = "artifacts/FreeFlight-Cabin-Control-v$env:RELEASE_VERSION-win-x64.zip"
          $checksum = "$asset.sha256"
          $installer = "artifacts/FreeFlight-Cabin-Control-v$env:RELEASE_VERSION-Setup.exe"
          $installerChecksum = "$installer.sha256"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset $checksum $installer $installerChecksum --clobber
            gh release edit $tag --title "FreeFlight Cabin Control $tag" --notes-file artifacts/release-notes.md --latest
          } else {
            gh release create $tag $asset $checksum $installer $installerChecksum `
              --target "${{ github.sha }}" `
              --title "FreeFlight Cabin Control $tag" `
              --notes-file artifacts/release-notes.md `
              --latest
          }
