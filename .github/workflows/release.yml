name: Publish FreeFlight update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freeflight-release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out the complete release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Choose the release version
        id: version
        shell: pwsh
        run: |
          $version = "0.5.0.1"
          $assemblyVersion = $version
          "version=$version" >> $env:GITHUB_OUTPUT
          "assembly=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "asset=FreeFlight-Cabin-Control-v$version-win-x64.zip" >> $env:GITHUB_OUTPUT
          "installer=FreeFlight-Cabin-Control-v$version-Setup.exe" >> $env:GITHUB_OUTPUT

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore FreeFlight.CabinControl.slnx
          dotnet build FreeFlight.CabinControl.slnx -c Release --no-restore `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly }} `
            -p:FileVersion=${{ steps.version.outputs.assembly }}

      - name: Validate display-only progress bindings
        shell: pwsh
        run: |
          $pattern = '<ProgressBar[^>]*Value="\{Binding(?![^\"]*Mode=OneWay)[^\"]*\}"'
          $violations = Get-ChildItem src/FreeFlight.CabinControl.App -Recurse -Filter *.xaml | Select-String -Pattern $pattern
          if ($violations) {
            $violations | ForEach-Object { Write-Host "Unsafe ProgressBar binding: $($_.Path):$($_.LineNumber) $($_.Line.Trim())" }
            throw "ProgressBar bindings must explicitly use Mode=OneWay unless the source property is writable."
          }

      - name: Run core regression checks
        shell: pwsh
        run: dotnet run --project tests/FreeFlight.CabinControl.Core.Tests/FreeFlight.CabinControl.Core.Tests.csproj -c Release --no-build

      - name: Build the FreeFlight X-Plane plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" `
            -OutFile artifacts/XPSDK430.zip
          Expand-Archive artifacts/XPSDK430.zip -DestinationPath artifacts/xplane-sdk
          cmake -S xplane-plugin -B artifacts/xplane-plugin-build -A x64 `
            -DXPLANE_SDK_ROOT="$PWD/artifacts/xplane-sdk/SDK"
          cmake --build artifacts/xplane-plugin-build --config Release
          $destination = "xplane-plugin/dist/FreeFlightCabinBridge/64"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item artifacts/xplane-plugin-build/Release/win.xpl "$destination/win.xpl" -Force

      - name: Publish the Windows application
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          dotnet publish src/FreeFlight.CabinControl.App/FreeFlight.CabinControl.App.csproj `
            -c Release -r win-x64 --self-contained true `
            --source https://api.nuget.org/v3/index.json `
            -o artifacts/publish `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly }} `
            -p:FileVersion=${{ steps.version.outputs.assembly }} `
            -p:InformationalVersion=${{ steps.version.outputs.version }}+$shortSha

      - name: Startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/publish/FreeFlight.CabinControl.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($process.HasExited) {
            throw "Published FreeFlight Cabin Control exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Generate release notes and bundled changelog
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $date = Get-Date -Format "yyyy-MM-dd"
          $previous = git describe --tags --abbrev=0 2>$null
          if ($LASTEXITCODE -eq 0 -and $previous) {
            $range = "$previous..HEAD"
            $changes = git log $range --pretty=format:"- %s (`%h`)"
            $comparison = "Changes since $previous"
          } else {
            $changes = git log -30 --pretty=format:"- %s (`%h`)"
            $comparison = "Published release history"
          }
          if (-not $changes) { $changes = "- v0.5.0.1 stability hotfix." }
          $sourceChangelog = Get-Content CHANGELOG.md -Raw
          $notes = @"
          # FreeFlight Cabin Control $tag

          Published $date from the `main` branch.

          ## $comparison

          $($changes -join "`n")

          ## Project changelog

          $sourceChangelog
          "@
          $notes | Set-Content artifacts/release-notes.md -Encoding utf8
          $notes | Set-Content artifacts/publish/CHANGELOG.md -Encoding utf8

      - name: Build the Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVersion=${{ steps.version.outputs.version }}" installer/FreeFlight.CabinControl.iss

      - name: Package and checksum the update
        shell: pwsh
        run: |
          $asset = "artifacts/${{ steps.version.outputs.asset }}"
          Compress-Archive -Path artifacts/publish/* -DestinationPath $asset -CompressionLevel Optimal
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ steps.version.outputs.asset }}" | Set-Content "$asset.sha256" -Encoding ascii
          $installer = "artifacts/${{ steps.version.outputs.installer }}"
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  ${{ steps.version.outputs.installer }}" | Set-Content "$installer.sha256" -Encoding ascii

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $asset = "artifacts/${{ steps.version.outputs.asset }}"
          $checksum = "$asset.sha256"
          $installer = "artifacts/${{ steps.version.outputs.installer }}"
          $installerChecksum = "$installer.sha256"
          gh release create $tag $asset $checksum $installer $installerChecksum `
            --target "${{ github.sha }}" `
            --title "FreeFlight Cabin Control $tag" `
            --notes-file artifacts/release-notes.md `
            --latest
