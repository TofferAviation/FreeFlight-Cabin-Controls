name: Publish FreeFlight update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freeflight-release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out the complete release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Choose the release version
        id: version
        shell: pwsh
        run: |
          $series = "0.4"
          $patches = git tag --list "v$series.*" | ForEach-Object {
            if ($_ -match '^v0\.4\.(\d+)$') { [int]$Matches[1] }
          }
          $patch = if ($patches) { (($patches | Measure-Object -Maximum).Maximum + 1) } else { 0 }
          $version = "$series.$patch"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "asset=FreeFlight-Cabin-Control-v$version-win-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore FreeFlight.CabinControl.slnx
          dotnet build FreeFlight.CabinControl.slnx -c Release --no-restore `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 `
            -p:FileVersion=${{ steps.version.outputs.version }}.0

      - name: Run core regression checks
        shell: pwsh
        run: dotnet run --project tests/FreeFlight.CabinControl.Core.Tests/FreeFlight.CabinControl.Core.Tests.csproj -c Release --no-build

      - name: Publish the Windows application
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          dotnet publish src/FreeFlight.CabinControl.App/FreeFlight.CabinControl.App.csproj `
            -c Release -r win-x64 --self-contained true `
            --source https://api.nuget.org/v3/index.json `
            -o artifacts/publish `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 `
            -p:FileVersion=${{ steps.version.outputs.version }}.0 `
            -p:InformationalVersion=${{ steps.version.outputs.version }}+$shortSha

      - name: Generate release notes and bundled changelog
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $date = Get-Date -Format "yyyy-MM-dd"
          $previous = git describe --tags --abbrev=0 2>$null
          if ($LASTEXITCODE -eq 0 -and $previous) {
            $range = "$previous..HEAD"
            $changes = git log $range --pretty=format:"- %s (`%h`)"
            $comparison = "Changes since $previous"
          } else {
            $changes = git log -30 --pretty=format:"- %s (`%h`)"
            $comparison = "Initial published release history"
          }
          if (-not $changes) { $changes = "- Release packaging and maintenance updates." }
          $sourceChangelog = Get-Content CHANGELOG.md -Raw
          $notes = @"
          # FreeFlight Cabin Control $tag

          Published $date from the `main` branch.

          ## $comparison

          $($changes -join "`n")

          ## Project changelog

          $sourceChangelog
          "@
          $notes | Set-Content artifacts/release-notes.md -Encoding utf8
          $notes | Set-Content artifacts/publish/CHANGELOG.md -Encoding utf8

      - name: Package and checksum the update
        shell: pwsh
        run: |
          $asset = "artifacts/${{ steps.version.outputs.asset }}"
          Compress-Archive -Path artifacts/publish/* -DestinationPath $asset -CompressionLevel Optimal
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ steps.version.outputs.asset }}" | Set-Content "$asset.sha256" -Encoding ascii

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $asset = "artifacts/${{ steps.version.outputs.asset }}"
          $checksum = "$asset.sha256"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset $checksum --clobber
            gh release edit $tag `
              --title "FreeFlight Cabin Control $tag" `
              --notes-file artifacts/release-notes.md `
              --latest
          } else {
            gh release create $tag $asset $checksum `
              --target "${{ github.sha }}" `
              --title "FreeFlight Cabin Control $tag" `
              --notes-file artifacts/release-notes.md `
              --latest
          }
