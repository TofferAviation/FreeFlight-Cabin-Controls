name: FreeFlight Discord Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  post-release:
    runs-on: ubuntu-latest

    env:
      PRODUCT_NAME: "VA Cabin Controls"
      PLATFORM: "X-Plane 12"

      # Paste the Discord role ID here
      PRODUCT_UPDATES_ROLE_ID: "1545508476988690492"

      DISCORD_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}

    steps:
      - name: Build FreeFlight Discord changelog
        shell: python
        run: |
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)

          release = event["release"]

          product = os.environ.get("PRODUCT_NAME", "FreeFlight Product")
          platform = os.environ.get("PLATFORM", "PC")
          role_id = os.environ.get("PRODUCT_UPDATES_ROLE_ID", "")

          version = release.get("tag_name", "Unknown")
          release_name = release.get("name") or version
          release_url = release.get("html_url", "")
          changelog = (release.get("body") or "No changelog was provided.").strip()

          if len(changelog) > 3400:
              changelog = changelog[:3380].rstrip()
              changelog += "\n\n**…View the complete changelog on GitHub.**"

          # Release type
          version_lower = version.lower()

          if "alpha" in version_lower:
              release_channel = "🔴 Alpha"
              embed_color = 15158332

          elif release.get("prerelease", False):
              release_channel = "🟣 Beta"
              embed_color = 10181046

          else:
              release_channel = "🟢 Stable"
              embed_color = 3447003

          # Calculate release asset size
          assets = release.get("assets") or []
          total_bytes = sum(asset.get("size", 0) for asset in assets)

          def human_size(size):
              if size <= 0:
                  return "N/A"

              units = ["B", "KB", "MB", "GB"]
              size = float(size)

              for unit in units:
                  if size < 1024 or unit == units[-1]:
                      if unit == "B":
                          return f"{int(size)} {unit}"
                      return f"{size:.1f} {unit}"

                  size /= 1024

          update_size = human_size(total_bytes)

          # Download information
          if len(assets) == 1:
              asset = assets[0]

              download_text = (
                  f"[⬇️ Download {asset['name']}]"
                  f"({asset['browser_download_url']})"
              )

          elif len(assets) > 1:
              download_text = (
                  f"[⬇️ View {len(assets)} Downloads]"
                  f"({release_url})"
              )

          else:
              download_text = (
                  f"[🔗 View Release on GitHub]"
                  f"({release_url})"
              )

          embed = {
              "title": f"✈️ {product} — {release_name}",
              "url": release_url,
              "color": embed_color,

              "description": changelog,

              "fields": [
                  {
                      "name": "📦 Product",
                      "value": product,
                      "inline": True
                  },
                  {
                      "name": "🏷️ Version",
                      "value": version,
                      "inline": True
                  },
                  {
                      "name": "📡 Release Channel",
                      "value": release_channel,
                      "inline": True
                  },
                  {
                      "name": "🖥️ Platform",
                      "value": platform,
                      "inline": True
                  },
                  {
                      "name": "💾 Update Size",
                      "value": update_size,
                      "inline": True
                  },
                  {
                      "name": "📥 Download",
                      "value": download_text,
                      "inline": False
                  }
              ],

              "footer": {
                  "text": "FreeFlight Systems • Official Release"
              }
          }

          if release.get("published_at"):
              embed["timestamp"] = release["published_at"]

          payload = {
              "username": "FreeFlight Updates",
              "content": (
                  f"<@&{role_id}> **A new {product} update is available!**"
                  if role_id
                  else f"**A new {product} update is available!**"
              ),

              "allowed_mentions": {
                  "roles": [role_id] if role_id else []
              },

              "embeds": [embed]
          }

          with open("discord-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)

      - name: Post changelog to Discord
        run: |
          curl --fail-with-body \
            -H "Content-Type: application/json" \
            --data-binary @discord-payload.json \
            "$DISCORD_WEBHOOK"
